services:
  rickdex:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    container_name: rickdex-app

  # Development service (optional)
  rickdex-dev:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
    command: sh -c "npm install && npm run dev"
    container_name: rickdex-dev
    profiles:
      - dev
